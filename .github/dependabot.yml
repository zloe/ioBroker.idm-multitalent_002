version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: cron
    cronjob: "23 4 3 * *"
    timezone: Europe/Berlin
  open-pull-requests-limit: 20
  assignees:
  - zloe
  versioning-strategy: increase
  cooldown:
    default-days: 7
  ignore:
  - dependency-name: "@types/node"
    update-types: ["version-update:semver-major"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: cron
    cronjob: "47 4 17 * *"
    timezone: Europe/Berlin
  open-pull-requests-limit: 20
  assignees:
  - zloe
  cooldown:
    default-days: 7
