# Configure here which Dependabot updates get merged automatically by
# .github/workflows/automerge-dependabot.yml (iobroker-bot-orga/action-automerge-dependabot).
# See https://github.com/iobroker-bot-orga/action-automerge-dependabot#configuration-options for
# the full rule syntax.
- match:
    # Only merge patches for production dependencies
    dependency_type: production
    update_type: "semver:patch"
- match:
    # development dependencies can have a minor update, too
    dependency_type: development
    update_type: "semver:minor"
- match:
    # package-lock.json-only changes (a transitive dependency bump) up to a minor update
    dependency_type: package-lock
    update_type: "semver:minor"
