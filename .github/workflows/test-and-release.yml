name: Test and Release

on:
  push:
    branches:
      - "main"
    tags:
      # normal versions, e.g. v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases, e.g. v1.2.3-beta.1
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: ioBroker/testing-action-check@v1
        with:
          node-version: "24.x"
          install-command: "npm install"
          package-cache: false
          lint: true

  # Runs adapter tests on all supported Node.js LTS versions and OSes
  adapter-tests:
    needs: check-and-lint

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          install-command: "npm install"
          package-cache: false

  # Deploys the final package to NPM
  #
  # Voraussetzungen:
  # - npm Trusted Publisher für dieses Repo + diese Workflow-Datei unter
  #   npmjs.com -> Paket -> Settings -> Trusted Publisher konfiguriert
  #   (die alten "Automation"-Tokens werden von npm nicht mehr unterstützt)
  # - Bei Sentry zusätzlich SENTRY_AUTH_TOKEN hinterlegen und Sentry-Block aktivieren
  deploy:
    needs: [check-and-lint, adapter-tests]

    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: "24.x"
          install-command: "npm install"
          package-cache: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Only enable if Sentry is really configured:
          # sentry: true
          # sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # sentry-project: "iobroker-idm-multitalent_002"
          # sentry-version-prefix: "iobroker.idm-multitalent_002"
          # sentry-github-integration: true
